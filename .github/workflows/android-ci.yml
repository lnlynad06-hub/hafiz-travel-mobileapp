name: Android CI

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging, develop]

jobs:
  test-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

  signed-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build signed release
        env:
          HAFIZ_KEYSTORE_PATH: release.keystore
          HAFIZ_KEYSTORE_PASSWORD: ${{ secrets.HAFIZ_KEYSTORE_PASSWORD }}
          HAFIZ_KEY_ALIAS: ${{ secrets.HAFIZ_KEY_ALIAS }}
          HAFIZ_KEY_PASSWORD: ${{ secrets.HAFIZ_KEY_PASSWORD }}
          HAFIZ_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HAFIZ_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleRelease --console=plain
      - name: Verify release signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hafiz-travel-release-apk
          path: app/build/outputs/apk/release/app-release.apk
